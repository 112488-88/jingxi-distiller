name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集站点文件（不含 deploy / dist / docs）
        run: |
          mkdir -p _site
          cp index.html style.css app.js parse.js tone.js prompts.js \
             manifest.webmanifest sw.js _site/
          cp -r parsers _site/
          mkdir -p _site/assets
          cp assets/*.png _site/assets/
          cp docs/manual.pdf _site/manual.pdf
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
